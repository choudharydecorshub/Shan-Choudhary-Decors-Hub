<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aks Decoration House - UP Taj Rush 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #03030c;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
            z-index: 10;
        }
        #score-board {
            margin-bottom: 5px;
            color: #00ffcc;
        }
        #speed-board {
            color: #ff007f;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 25, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00ffff;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 30px #00ffff;
            display: none;
            z-index: 20;
        }
        #game-over h1 {
            font-size: 40px;
            color: #ff007f;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff007f;
        }
        #game-over button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background: #00ffcc;
            border: none;
            color: #000;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffcc;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .btn {
            width: 75px;
            height: 75px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #00ffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 32px;
            box-shadow: 0 0 15px #00ffff;
            touch-action: manipulation;
        }
    </style>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-overlay">
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <div id="speed-board">SPEED: <span id="speed">120</span> KM/H</div>
    </div>

    <div id="game-over">
        <h1>CRASHED!</h1>
        <p>Aapka Score: <span id="final-score">0</span></p>
        <button onclick="restartGame()">RESTART RUSH</button>
    </div>

    <div id="controls">
        <div class="btn" id="left-btn">◄</div>
        <div class="btn" id="right-btn">►</div>
    </div>

    <script>
        let scene, camera, renderer;
        let playerCar, road, tajMahal;
        let enemies = [];
        let namePlates = [];
        let score = 0, speed = 1.4, isGameOver = false;
        
        let moveLeft = false, moveRight = false;
        const roadWidth = 12;
        const laneX = [-3.5, 0, 3.5];

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a20, 0.012);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 8);
            camera.rotation.x = -0.15;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Neon Lighting
            const ambientLight = new THREE.AmbientLight(0x221144, 1.5);
            scene.add(ambientLight);

            const cyanLight = new THREE.DirectionalLight(0x00ffff, 1.2);
            cyanLight.position.set(-10, 20, -10);
            scene.add(cyanLight);

            const pinkLight = new THREE.DirectionalLight(0xff007f, 1.2);
            pinkLight.position.set(10, 20, 10);
            scene.add(pinkLight);

            // World Creation
            createNeonRoad();
            createGlowingTajMahal();
            createPlayerCar();
            createRoadNamePlates();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            setupTouchControls();

            animate();
        }

        // Cyberpunk Track
        function createNeonRoad() {
            const roadGeo = new THREE.PlaneGeometry(roadWidth, 400);
            const roadMat = new THREE.MeshPhongMaterial({ color: 0x050510, shininess: 80 });
            road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -150;
            scene.add(road);

            [-6.1, 6.1].forEach(x => {
                const borderGeo = new THREE.BoxGeometry(0.3, 0.3, 400);
                const borderMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                const border = new THREE.Mesh(borderGeo, borderMat);
                border.position.set(x, 0.1, -150);
                scene.add(border);
            });

            for (let i = 0; i < 40; i++) {
                const stripeGeo = new THREE.PlaneGeometry(0.25, 4);
                const stripeMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.rotation.x = -Math.PI / 2;
                stripe.position.set(0, 0.02, -i * 10);
                scene.add(stripe);
            }
        }

        // Road Side "Aks Decoration House" Name Plates / Billboards
        function createRoadNamePlates() {
            for (let i = 0; i < 15; i++) {
                // Canvas texture to write business name dynamically on plates
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                // Background of signboard
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Neon Border
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 8;
                ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);
                
                // Text Style
                ctx.fillStyle = '#ff007f';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('AKS DECORATION HOUSE', canvas.width / 2, canvas.height / 2);

                const texture = new THREE.CanvasTexture(canvas);
                const plateGeo = new THREE.PlaneGeometry(4, 1.2);
                const plateMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });

                // Left Side Plate
                const leftPlate = new THREE.Mesh(plateGeo, plateMat);
                leftPlate.position.set(-8.5, 2, -i * 25);
                scene.add(leftPlate);
                namePlates.push(leftPlate);

                // Right Side Plate
                const rightPlate = new THREE.Mesh(plateGeo, plateMat);
                rightPlate.position.set(8.5, 2, -i * 25);
                rightPlate.rotation.y = Math.PI;
                scene.add(rightPlate);
                namePlates.push(rightPlate);
            }
        }

        // Glowing Taj Mahal Backdrop
        function createGlowingTajMahal() {
            tajMahal = new THREE.Group();

            const whiteNeonMat = new THREE.MeshBasicMaterial({ color: 0xe0ffff });
            const domeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xff007f });

            const baseGeo = new THREE.BoxGeometry(26, 12, 10);
            const base = new THREE.Mesh(baseGeo, whiteNeonMat);
            base.position.set(0, 6, 0);
            tajMahal.add(base);

            const mainDomeGeo = new THREE.SphereGeometry(6, 16, 16);
            const mainDome = new THREE.Mesh(mainDomeGeo, domeMat);
            mainDome.position.set(0, 16, 0);
            mainDome.scale.set(1, 1.3, 1);
            tajMahal.add(mainDome);

            const archGeo = new THREE.BoxGeometry(8, 8, 10.2);
            const arch = new THREE.Mesh(archGeo, glowMat);
            arch.position.set(0, 5, 0);
            tajMahal.add(arch);

            const minaretPositions = [-18, -12, 12, 18];
            minaretPositions.forEach(x => {
                const towerGeo = new THREE.CylinderGeometry(0.8, 1.2, 22, 12);
                const tower = new THREE.Mesh(towerGeo, whiteNeonMat);
                tower.position.set(x, 11, 2);

                const topDomeGeo = new THREE.SphereGeometry(1.2, 8, 8);
                const topDome = new THREE.Mesh(topDomeGeo, glowMat);
                topDome.position.set(x, 22.5, 2);

                tajMahal.add(tower);
                tajMahal.add(topDome);
            });

            tajMahal.position.set(0, 0, -180);
            scene.add(tajMahal);
        }

        // Sports Car
        function createPlayerCar() {
            playerCar = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 3.4);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x00ffff, shininess: 100 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.4;
            playerCar.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.3, 0.5, 1.8);
            const cabinMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.8, -0.2);
            playerCar.add(cabin);

            playerCar.position.set(0, 0, 4);
            scene.add(playerCar);
        }

        // Traffic Cars Spawning
        function spawnEnemy() {
            const colors = [0xff007f, 0xffff00, 0x00ff00, 0x9900ff];
            const enemyGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(1.8, 0.6, 3.2);
            const bodyMat = new THREE.MeshBasicMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.4;
            enemyGroup.add(body);

            const lane = laneX[Math.floor(Math.random() * laneX.length)];
            enemyGroup.position.set(lane, 0, -140);

            scene.add(enemyGroup);
            enemies.push(enemyGroup);
        }

        function onKeyDown(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
        }

        function onKeyUp(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
        }

        function setupTouchControls() {
            document.getElementById('left-btn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
            document.getElementById('left-btn').addEventListener('touchend', () => moveLeft = false);
            document.getElementById('right-btn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
            document.getElementById('right-btn').addEventListener('touchend', () => moveRight = false);
        }

        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            if (moveLeft && playerCar.position.x > -4.2) {
                playerCar.position.x -= 0.18;
                playerCar.rotation.z = 0.12;
            } else if (moveRight && playerCar.position.x < 4.2) {
                playerCar.position.x += 0.18;
                playerCar.rotation.z = -0.12;
            } else {
                playerCar.rotation.z = 0;
            }

            if (Math.random() < 0.025) spawnEnemy();

            // Move Name Plates for scrolling effect
            namePlates.forEach(plate => {
                plate.position.z += speed;
                if (plate.position.z > 10) {
                    plate.position.z -= 375; // Loop back
                }
            });

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].position.z += speed;

                const pBox = new THREE.Box3().setFromObject(playerCar);
                const eBox = new THREE.Box3().setFromObject(enemies[i]);

                if (pBox.intersectsBox(eBox)) {
                    triggerGameOver();
                }

                if (enemies[i].position.z > 12) {
                    scene.remove(enemies[i]);
                    enemies.splice(i, 1);
                    score += 10;
                    speed += 0.006;
                    document.getElementById('score').innerText = score;
                    document.getElementById('speed').innerText = Math.floor(speed * 90);
                }
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').style.display = 'block';
        }

        function restartGame() {
            enemies.forEach(e => scene.remove(e));
            enemies = [];
            score = 0;
            speed = 1.4;
            playerCar.position.set(0, 0, 4);
            document.getElementById('score').innerText = score;
            document.getElementById('speed').innerText = Math.floor(speed * 90);
            document.getElementById('game-over').style.display = 'none';
            isGameOver = false;
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
